name: Public source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the compression library for synthetic tests
        run: sudo apt-get update && sudo apt-get install -y libzstd1
      - name: Check public files
        run: python scripts/check_public.py
      - name: Test with synthetic data only
        run: python -m unittest discover -s tests -v
